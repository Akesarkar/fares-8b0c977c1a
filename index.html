<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="googlebot" content="noindex,nofollow">
  <title>Atlanta → Mumbai fares</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      --paper: #f3eee4;
      --paper-2: #fffaf2;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #ddd4c4;
      --accent: #8c2f14;
      --accent-soft: #f3e0d4;
      --teal: #143f3a;
      --teal-2: #1b5a52;
      --good: #1f6b4a;
      --wait: #8a5a12;
      --warn: #8c2f14;
      --shadow: 0 10px 30px rgba(28, 25, 21, 0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
      font-size: 17px;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 18px 64px;
    }
    header.top {
      padding: 8px 0 20px;
    }
    header.top p.kicker {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 6px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.15;
      margin: 0 0 10px;
    }
    .updated {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0;
    }
    .updated strong { font-weight: 650; color: var(--ink); }
    .fuel-line { color: var(--muted); font-weight: 500; }
    section { margin: 22px 0 28px; }
    h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.45rem;
      margin: 0 0 12px;
      font-weight: 600;
    }
    h3 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.08rem;
      margin: 0 0 6px;
      font-weight: 600;
    }

    /* Prominent recommendation */
    .reco {
      background: var(--teal);
      color: #f7f3ea;
      border-radius: 16px;
      padding: 14px 16px 12px;
      box-shadow: var(--shadow);
    }
    .reco h2 {
      color: #f7f3ea;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 8px;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 700;
    }
    .reco .reco-lead {
      margin: 0 0 16px;
      color: #d8e6e2;
      font-size: 0.98rem;
    }
    .reco-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .reco-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 16px 16px 14px;
    }
    .reco-card .label {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: #c9e0db;
      margin-bottom: 6px;
    }
    .reco-card .action {
      font-family: "Source Sans 3", sans-serif;
      font-size: 1.02rem;
      line-height: 1.4;
      margin: 0;
      font-weight: 600;
    }
    .reco-card .threshold {
      display: inline-block;
      background: #e8c37a;
      color: #1c1915;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .reco-card .why-short {
      margin: 0;
      color: #dce8e5;
      font-size: 0.95rem;
    }

    .why {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 4px 4px;
    }
    .why-item {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
    }
    .why-item:first-child { border-top: 0; }
    .why-item p { margin: 0; color: #2b2722; }
    .why-item .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 4px;
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
    }
    th {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: #efe8db;
      position: sticky;
      top: 0;
    }
    tr:last-child td { border-bottom: 0; }
    .price {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
    }
    .price small {
      display: block;
      font-weight: 500;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge.est { background: #f3e0d4; color: var(--accent); }
    .badge.real { background: #dceee4; color: var(--good); }
    .badge.kayak { background: #e4e8f5; color: #2a3a7a; }
    .badge.sky { background: #dceeee; color: #155e5a; }
    .badge.warn { background: #f3e0d4; color: var(--accent); }
    a.src {
      color: var(--teal-2);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .chart-card {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 16px 10px;
      box-shadow: var(--shadow);
    }
    .chart-card p.caption {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 10px;
    }
    .chart-box { position: relative; height: min(420px, 70vw); }
    .notes ul { margin: 0; padding: 0; list-style: none; }
    .notes li {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 0 0 10px;
    }
    footer.sources {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    footer.sources ol { padding-left: 20px; margin: 8px 0 0; }
    footer.sources a { color: var(--teal-2); }
    .error {
      background: #f8e4dc;
      border: 1px solid #e2b8aa;
      color: #6b2412;
      padding: 14px 16px;
      border-radius: 12px;
    }

    /* Fare grids */
    .grid-card h3 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.12rem;
      margin: 0 0 6px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin: 0 0 14px;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .legend-scale {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-bar {
      width: 120px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, hsl(125, 58%, 86%), hsl(62, 64%, 80%), hsl(32, 70%, 72%), hsl(5, 70%, 62%));
      border: 1px solid var(--line);
    }
    .legend-swatch, .legend-book, .legend-book-ss, .legend-empty {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: #efe8db;
      border: 1px solid #d3cbbd;
      display: inline-block;
    }
    .swatch.book {
      background: hsl(125, 58%, 82%);
      border: 2px solid #1f6b4a;
    }
    .swatch.book-ss {
      background: hsl(125, 58%, 82%);
      border: 2px dashed #1f6b4a;
    }
    .cal-month { margin: 0 0 20px; }
    .cal-month h4 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.02rem;
      margin: 0 0 8px;
    }
    .cal-weekdays, .cal-weeks {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }
    .cal-weekdays span {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 0 4px;
    }
    .cal-cell {
      min-height: 96px;
      border-radius: 9px;
      padding: 5px 5px 6px;
      background: #efe8db;
      color: var(--ink);
      border: 1px solid transparent;
    }
    .cal-cell.out, .cal-cell.empty {
      background: #efe8db;
      color: #9a9388;
    }
    .cal-cell.out { opacity: 0.65; }
    .cal-cell.has {
      border-color: rgba(28,25,21,0.06);
    }
    .cal-cell.book {
      border: 2.5px solid #1f6b4a;
      box-shadow: 0 0 0 1px rgba(31,107,74,0.25);
    }
    .cal-cell.book-ss {
      border: 2.5px dashed #1f6b4a;
    }
    .cal-day {
      font-weight: 700;
      font-size: 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .cal-flag {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #1f6b4a;
      color: #fff;
      border-radius: 999px;
      padding: 0 5px;
      line-height: 1.4;
    }
    .cal-main {
      font-weight: 800;
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .cal-inr {
      font-size: 0.68rem;
      opacity: 0.8;
      margin-bottom: 3px;
    }
    .cal-src {
      font-size: 0.65rem;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }
    a.cal-cell, a.rt-cell {
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    a.cal-cell:hover, a.rt-cell:hover,
    .cal-cell:hover, .rt-cell:hover, .opt-row:hover {
      filter: brightness(0.97);
      box-shadow: 0 0 0 2px rgba(20, 63, 58, 0.28);
    }
    .cal-cell a, .rt-cell a, .cal-main-link, .cal-src a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .cal-src a { display: block; }
    .cal-src a:hover, .cal-main-link:hover { text-decoration: underline; }
    .opt-row { position: relative; cursor: pointer; }
    .opt-row a.row-hit {
      position: absolute;
      inset: 0;
      z-index: 1;
      text-decoration: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .rt-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -4px;
      padding: 0 4px 6px;
    }
    .rt-table {
      border-collapse: separate;
      border-spacing: 4px;
      min-width: 920px;
      width: 100%;
      font-size: 0.82rem;
    }
    .rt-table th, .rt-table td {
      border-bottom: 0;
      padding: 8px 8px;
      vertical-align: top;
    }
    .rt-table thead th {
      background: #efe8db;
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .rt-table th.rt-depart, .rt-table td.rt-depart {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--paper-2);
      min-width: 7.5rem;
      text-align: left;
      font-weight: 700;
    }
    .rt-table thead th.rt-depart { z-index: 3; background: #efe8db; }
    .rt-cell {
      min-width: 5.6rem;
      min-height: 4.4rem;
      border-radius: 8px;
      padding: 7px 6px;
      text-align: left;
    }
    .rt-cell.unscanned {
      background: #efe8db;
      color: #8a8378;
      font-size: 0.68rem;
      line-height: 1.25;
      min-height: 3.4rem;
    }
    .rt-cell.has { border: 1px solid rgba(28,25,21,0.06); }
    .rt-cell.book { border: 2.5px solid #1f6b4a; }
    .rt-cell.book-ss { border: 2.5px dashed #1f6b4a; }
    .rt-cell .cal-main { font-size: 1rem; }
    .rt-cell .cal-src { font-size: 0.7rem; }
    .cal-day { min-width: 0; gap: 2px; }
    .cal-flag { flex: 0 0 auto; }
    @media (max-width: 760px) {
      .cal-cell { min-height: 84px; padding: 4px 3px 5px; overflow: hidden; }
      .cal-main { font-size: 0.78rem; }
      .cal-src { font-size: 0.58rem; }
      .cal-cell .cal-inr { display: none; }
      .cal-flag { font-size: 0.55rem; padding: 0 4px; }
      .cal-weekdays, .cal-weeks { gap: 3px; }
      .legend { font-size: 0.8rem; }
      table { min-width: 0; }
      .table-wrap table, .table-wrap thead, .table-wrap tbody, .table-wrap th, .table-wrap td, .table-wrap tr {
        display: block;
        width: 100%;
      }
      .table-wrap thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .table-wrap tr.opt-row {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .table-wrap td {
        padding: 2px 0;
        border-bottom: 0;
      }
      .table-wrap td.price { font-size: 1.05rem; }
    }
    .reco-note {
      margin: 12px 0 0;
      color: #dce8e5;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .hours { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .qatar-empty {
      background: var(--paper-2);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
      margin: 0;
    }
    .qatar-rec {
      background: var(--teal);
      color: #f7f3ea;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .qatar .cal-cell { min-height: 72px; }
    .qatar .cal-src { display: none; }
    .qatar-rt { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 10px; }
    .qatar-rt table {
      min-width: 640px;
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      font-size: 0.82rem;
    }
    .qatar-rt th, .qatar-rt td { border-bottom: 0; padding: 6px; vertical-align: top; }
    .qatar-rt thead th {
      background: #efe8db;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .qatar-rt .rt-depart { font-weight: 700; min-width: 6.5rem; background: var(--paper-2); }
    .qatar a.rt-cell { min-height: 3.6rem; }
    @media (max-width: 760px) {
      .reco { padding: 18px 16px; border-radius: 18px; }
      .reco-grid { grid-template-columns: 1fr; }
      .reco-card .action { font-size: 1.12rem; }
      body { font-size: 16px; }
      .chart-box { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Atlanta → Mumbai</h1>
      <p class="updated" id="stamp">Updated <strong id="updated">—</strong></p>
    </header>

    <div id="app">
      <p>Loading the latest fares…</p>
    </div>
  </div>

  <script>
    const INR_FMT = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
    const USD_FMT = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
    const DATE_FMT = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function usd(n) { return "$" + USD_FMT.format(Math.round(n)); }
    function inr(n, rate) { return "₹" + INR_FMT.format(Math.round(n * rate)); }
    function fmtDate(iso) {
      if (!iso) return "—";
      if (/^\d{4}-\d{2}$/.test(iso)) {
        const [y, m] = iso.split("-");
        const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return (names[Number(m) - 1] || m) + " " + y;
      }
      const d = new Date(iso + "T00:00:00");
      if (Number.isNaN(d.getTime())) return esc(iso);
      return DATE_FMT.format(d);
    }
    function tripLabel(t) { return t === "RT" || t === "roundtrip" ? "Round trip" : "One-way"; }
    function isMumbaiRoute(s) { return /BOM/i.test(String(s || "")); }

    function bytesConcat(parts) {
      let n = 0;
      for (const p of parts) n += p.length;
      const out = new Uint8Array(n);
      let o = 0;
      for (const p of parts) { out.set(p, o); o += p.length; }
      return out;
    }
    function varint(n) {
      const o = [];
      while (n > 127) { o.push((n % 128) | 0x80); n = Math.floor(n / 128); }
      o.push(n);
      return Uint8Array.from(o);
    }
    function vf(field, n) { return bytesConcat([varint(field * 8), varint(n)]); }
    function mf(field, raw) { return bytesConcat([varint(field * 8 + 2), varint(raw.length), raw]); }
    function strBytes(s) { return new TextEncoder().encode(s); }
    function sf(field, s) { return mf(field, strBytes(s)); }
    function airport(code) { return bytesConcat([vf(1, 1), sf(2, code)]); }
    function leg(day, from, to) { return bytesConcat([sf(2, day), mf(13, airport(from)), mf(14, airport(to))]); }
    function toBase64Url(bytes) {
      let bin = "";
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    function tfs({ oneway, origin, dest, depart, ret, cabin = "economy" }) {
      const cabinCode = { economy: 1, premium_economy: 2, business: 3, first: 4 }[cabin] || 1;
      const parts = [vf(1, 28), vf(2, 2), mf(3, leg(depart, origin, dest))];
      if (!oneway) parts.push(mf(3, leg(ret, dest, origin)));
      parts.push(vf(8, 1), vf(9, cabinCode), vf(14, 1));
      parts.push(mf(16, Uint8Array.from([8,255,255,255,255,255,255,255,255,255,1])));
      parts.push(vf(19, oneway ? 2 : 1));
      return toBase64Url(bytesConcat(parts));
    }
    function googleFlightsUrl({ oneway = false, origin = "ATL", dest = "BOM", depart, ret }) {
      return "https://www.google.com/travel/flights/search?tfs=" +
        tfs({ oneway, origin, dest, depart, ret }) + "&curr=USD&hl=en";
    }
    function yymmdd(iso) { return String(iso || "").replace(/-/g, "").slice(2); }
    function skyscannerUrl({ oneway = false, depart, ret }) {
      const base = "https://www.skyscanner.com/transport/flights/atl/bom/";
      if (oneway) return base + yymmdd(depart) + "/?adultsv2=1&cabinclass=economy&rtn=0&currency=USD&sortby=price";
      return base + yymmdd(depart) + "/" + yymmdd(ret) + "/?adultsv2=1&cabinclass=economy&rtn=1&currency=USD&sortby=price";
    }
    function gfUrl(cellOrOpt, oneway) {
      if (cellOrOpt && cellOrOpt.google_url) return cellOrOpt.google_url;
      if (oneway) return googleFlightsUrl({ oneway: true, depart: cellOrOpt.date || cellOrOpt.depart });
      return googleFlightsUrl({ depart: cellOrOpt.depart, ret: cellOrOpt.return });
    }
    function ssUrl(cellOrOpt, oneway) {
      if (cellOrOpt && cellOrOpt.skyscanner_url) return cellOrOpt.skyscanner_url;
      if (oneway) return skyscannerUrl({ oneway: true, depart: cellOrOpt.date || cellOrOpt.depart });
      return skyscannerUrl({ depart: cellOrOpt.depart, ret: cellOrOpt.return });
    }
    function extLink(href, inner, cls) {
      if (!href) return inner;
      return `<a class="${cls || ""}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    function badge(type) {
      if (type === "calendar_estimate") return '<span class="badge est">Estimate</span>';
      if (type === "itinerary") return '<span class="badge real">Itinerary</span>';
      if (type === "kayak_quote") return '<span class="badge kayak">Kayak quote</span>';
      if (type === "skyscanner_quote") return '<span class="badge sky">Skyscanner</span>';
      return "";
    }

    function cheapestHistory(history) {
      const map = new Map();
      for (const row of history || []) {
        if (!isMumbaiRoute(row.route)) continue;
        const key = [row.ts, row.route, row.trip].join("|");
        const prev = map.get(key);
        if (!prev || row.price < prev.price) map.set(key, row);
      }
      return [...map.values()].sort((a, b) => a.ts.localeCompare(b.ts) || a.route.localeCompare(b.route));
    }

    function render(data) {
      document.getElementById("updated").textContent = data.updated_ist || "—";
      const rate = Number(data.usd_inr) || 0;
      const rec = data.recommendation || {};
      const ow = rec.oneway || {};
      const rt = rec.roundtrip || {};
      const fuelDir = (data.fuel && data.fuel.direction) ? String(data.fuel.direction) : "";
      const stampExtra = fuelDir ? ` · Fuel: ${fuelDir}` : "";
      const stamp = document.getElementById("stamp");
      if (stamp) {
        stamp.innerHTML = `Updated <strong id="updated">${esc(data.updated_ist || "—")}</strong>${esc(stampExtra)}`;
      }

      const options = (data.best_options || []).filter(o => isMumbaiRoute(o.route) && !o.excluded).map(o => {
        const dates = o.return ? `${fmtDate(o.depart)} – ${fmtDate(o.return)}` : fmtDate(o.depart);
        const href = o.source_url || o.google_url || (o.return
          ? googleFlightsUrl({ depart: o.depart, ret: o.return })
          : googleFlightsUrl({ oneway: true, depart: o.depart }));
        const linkLabel = esc(o.source_name || "Open");
        const hours = o.hours || o.duration || "—";
        const twoBag = o.price_with_2bags_label
          || (o.price_with_2bags_usd != null ? usd(o.price_with_2bags_usd) : usd(o.price_usd) + " + bags?");
        const twoBagInr = (o.price_with_2bags_usd != null && rate)
          ? `<small>${inr(o.price_with_2bags_usd, rate)}</small>` : "";
        return `<tr class="opt-row">
          <td>${esc(tripLabel(o.trip))}<br><small>${esc(dates)}</small>${href ? `<a class="row-hit" href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="${linkLabel}"></a>` : ""}</td>
          <td class="price">${esc(twoBag)}${twoBagInr}${o.price_usd != null ? `<small>Fare ${usd(o.price_usd)}</small>` : ""}</td>
          <td class="hours">${esc(hours)}</td>
          <td>${esc(o.airline)}${o.stops ? `<br><small>${esc(o.stops)}</small>` : ""}</td>
          <td>${href ? `<a class="src" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${linkLabel}</a>` : ""}</td>
        </tr>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <section class="reco" id="recommendation">
          <h2>Recommendation</h2>
          <div class="reco-grid">
            <article class="reco-card">
              <div class="label">One-way${ow.threshold_usd ? " · " + usd(ow.threshold_usd) + " with 2 bags" : ""}</div>
              <p class="action">${esc(ow.action || "")}</p>
            </article>
            <article class="reco-card">
              <div class="label">Round trip · 170–179 days${rt.threshold_usd ? " · " + usd(rt.threshold_usd) + " with 2 bags" : ""}</div>
              <p class="action">${esc(rt.action || "")}</p>
            </article>
          </div>
          ${(data.alerts && data.alerts.black_friday) ? `<p class="reco-note">${esc(data.alerts.black_friday)}</p>` : ""}
        </section>

        <section aria-labelledby="cal-title">
          <h2 id="cal-title">Fare calendar</h2>
          <div class="chart-card grid-card">
            <h3>One-way</h3>
            <p class="caption">15 Dec 2026 – 15 Feb 2027. Large number is the Google Flights fare (USD + INR). GF = Google Flights. SS = Skyscanner (may include self-transfers, which are excluded).</p>
            <div id="owLegend" class="legend"></div>
            <div id="owGrid"></div>
          </div>
          <div class="chart-card grid-card">
            <h3>Round trip · stay 170–179 days (visa limit 180)</h3>
            <p class="caption">Every departure 15 Dec 2026 – 15 Feb 2027. Return date is on the cell. Grey = not scanned yet.</p>
            <div id="rtLegend" class="legend"></div>
            <div id="rtGrid"></div>
          </div>
          <div class="chart-card">
            <h3>One-way price trend</h3>
            <p class="caption">15 Dec 2026 – 15 Feb 2027. Google Flights and Skyscanner one-way fares. Skyscanner can include self-transfers.</p>
            <div class="chart-box"><canvas id="calChart"></canvas></div>
          </div>
        </section>

        <section aria-labelledby="best-title">
          <h2 id="best-title">Best options</h2>
          <p class="caption">Single-airline, single-ticket only. Price with 2 bags is the fare plus any fee to reach 2×23 kg each way.</p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Dates</th>
                  <th>Price with 2 bags</th>
                  <th>Hours</th>
                  <th>Airline</th>
                  <th>Link</th>
                </tr>
              </thead>
              <tbody>${options}</tbody>
            </table>
          </div>
        </section>

        <section class="qatar" aria-labelledby="qatar-title">
          <h2 id="qatar-title">${esc((data.qatar && data.qatar.title) || "Qatar Airways")}</h2>
          ${(data.qatar && data.qatar.recommendation) ? `<p class="qatar-rec">${esc(data.qatar.recommendation)}</p>` : ""}
          <p class="caption">${esc((data.qatar && ( (data.qatar.asof ? data.qatar.asof + ". " : "") + (data.qatar.note || "") )) || "")}</p>
          <h3>One-way calendar</h3>
          <p class="caption">Google Flights, Qatar filter. Cell opens that date’s search. Colour is relative to the $600 Classic (2-bag) line; a cheap cell is not automatically Classic.</p>
          ${qatarOnewayHTML(data, rate)}
          <h3>Verified one-way</h3>
          ${qatarOptionsHTML(data, rate) || `<p class="qatar-empty">No verified Qatar itinerary yet.</p>`}
          <h3>Round trip · 170–179 days</h3>
          <p class="caption">Lowest totals from qatarairways.com flexible-date calendar. Cells link to Google Flights for that date pair.</p>
          ${qatarRoundtripHTML(data, rate)}
          ${(data.qatar && data.qatar.return_note) ? `<p class="caption">${esc(data.qatar.return_note)}</p>` : ""}
          ${(data.qatar && data.qatar.gf_rt_note) ? `<p class="caption">${esc(data.qatar.gf_rt_note)}</p>` : ""}
        </section>
      `;

      renderFareGrids(data, rate);
      drawCalendar(data);
    }


    function qatarOnewayHTML(data, rate) {
      const q = data.qatar || {};
      const cal = q.calendar || {};
      const cells = cal.cells || [];
      if (!cells.length) return "";
      const map = new Map(cells.filter(c => c.date).map(c => [c.date, c]));
      const start = cal.window_start || "2026-12-15";
      const end = cal.window_end || "2027-02-15";
      const threshold = q.threshold_ow_usd || 600;
      const months = [];
      let cursor = parseISO(start.slice(0, 8) + "01");
      const last = parseISO(end);
      while (cursor <= last) {
        months.push(new Date(cursor));
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
      const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<span>${d}</span>`).join("");
      return months.map(monthDate => {
        const y = monthDate.getFullYear(), m = monthDate.getMonth();
        const label = monthDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        const first = new Date(y, m, 1);
        const startPad = (first.getDay() + 6) % 7; // Monday-first
        const daysIn = new Date(y, m + 1, 0).getDate();
        const items = [];
        for (let i = 0; i < startPad; i++) items.push({ type: "pad" });
        for (let day = 1; day <= daysIn; day++) {
          const iso = isoFromDate(new Date(y, m, day));
          const inWindow = iso >= start && iso <= end;
          const info = map.get(iso);
          if (!inWindow) items.push({ type: "out", day });
          else if (!info || info.price_usd == null) {
            const href = googleFlightsUrl({ oneway: true, depart: iso });
            items.push({ type: "empty", day, iso, href });
          } else {
            items.push({ type: "has", day, iso, price: info.price_usd, href: info.google_url || googleFlightsUrl({ oneway: true, depart: iso }) });
          }
        }
        const body = items.map(c => {
          if (c.type === "pad") return `<div class="cal-cell out" aria-hidden="true"></div>`;
          if (c.type === "out") return `<div class="cal-cell out"><div class="cal-day">${c.day}</div></div>`;
          if (c.type === "empty") return `<a class="cal-cell empty" href="${esc(c.href)}" target="_blank" rel="noopener noreferrer" title="Open Google Flights ${c.iso}"><div class="cal-day">${c.day}</div></a>`;
          const col = fareColor(c.price, threshold);
          return `<a class="cal-cell has" style="background:${col.bg};color:${col.ink}" href="${esc(c.href)}" target="_blank" rel="noopener noreferrer" title="Qatar-filter ${c.iso} ${usd(c.price)} — may include partner legs">
            <div class="cal-day">${c.day}</div>
            <div class="cal-main">${usd(c.price)}</div>
            ${rate ? `<div class="cal-inr">${inr(c.price, rate)}</div>` : ""}
          </a>`;
        }).join("");
        return `<div class="cal-month"><h4>${esc(label)}</h4><div class="cal-weekdays">${weekdays}</div><div class="cal-weeks">${body}</div></div>`;
      }).join("");
    }

    function qatarRoundtripHTML(data, rate) {
      const q = data.qatar || {};
      const cells = ((q.roundtrip || {}).cells) || [];
      if (!cells.length) return "";
      const departs = [...new Set(cells.map(c => c.depart))].sort();
      const stays = [...new Set(cells.map(c => c.stay_days))].sort((a,b) => a-b);
      const map = new Map(cells.map(c => [c.depart + "|" + c.stay_days, c]));
      const threshold = q.threshold_rt_usd || 950;
      const head = `<th class="rt-depart">Depart</th>` + stays.map(s => `<th>+${s}d</th>`).join("");
      const body = departs.map(dep => {
        const tds = stays.map(s => {
          const cell = map.get(dep + "|" + s);
          if (!cell) return `<td></td>`;
          const href = cell.google_url || googleFlightsUrl({ depart: dep, ret: cell.return });
          const col = fareColor(cell.price_usd, threshold);
          const tip = `${fmtDate(dep)} – ${fmtDate(cell.return)} (${s}d) ${usd(cell.price_usd)}`;
          return `<td><a class="rt-cell has" style="background:${col.bg};color:${col.ink}" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(tip)}">
            <div class="cal-day">${fmtDate(cell.return)}</div>
            <div class="cal-main">${usd(cell.price_usd)}</div>
            ${rate ? `<div class="cal-inr">${inr(cell.price_usd, rate)}</div>` : ""}
          </a></td>`;
        }).join("");
        return `<tr><td class="rt-depart">${fmtDate(dep)}</td>${tds}</tr>`;
      }).join("");
      return `<div class="qatar-rt"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function qatarOptionsHTML(data, rate) {
      const opts = ((data.qatar || {}).options) || [];
      if (!opts.length) return "";
      const rows = opts.map(o => {
        const dates = o.return ? `${fmtDate(o.depart)} – ${fmtDate(o.return)}` : fmtDate(o.depart);
        const href = o.source_url || o.google_url || "";
        const twoBag = o.price_with_2bags_label || (o.price_with_2bags_usd != null ? usd(o.price_with_2bags_usd) : usd(o.price_usd));
        const extra = [
          o.schedule,
          o.hours || o.duration,
          o.stops,
          o.google_usd != null ? `Google Flights ${usd(o.google_usd)}` : "",
          (o.alternates || []).filter(a => a.fare_family).map(a => `${a.fare_family} ${usd(a.price_usd)}`).join(" · ")
        ].filter(Boolean).join(" · ");
        return `<tr class="opt-row">
          <td>${esc(tripLabel(o.trip))}<br><small>${esc(dates)}</small>${href ? `<a class="row-hit" href="${esc(href)}" target="_blank" rel="noopener noreferrer"></a>` : ""}</td>
          <td class="price">${esc(twoBag)}${o.price_with_2bags_usd != null && rate ? `<small>${inr(o.price_with_2bags_usd, rate)}</small>` : ""}</td>
          <td class="hours">${esc(o.hours || o.duration || "—")}</td>
          <td>Qatar Airways${o.fare_family ? " " + esc(o.fare_family) : ""}${extra ? `<br><small>${esc(extra)}</small>` : ""}</td>
          <td>${href ? `<a class="src" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(o.source_name || "Open")}</a>` : ""}</td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><table><thead><tr><th>Dates</th><th>Price with 2 bags</th><th>Hours</th><th>Itinerary</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function parseISO(iso) { return new Date(iso + "T12:00:00"); }
    function isoFromDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    function addDaysISO(iso, n) {
      const d = parseISO(iso);
      d.setDate(d.getDate() + n);
      return isoFromDate(d);
    }
    function fareColor(price, threshold) {
      const lo = Math.min(threshold * 0.85, threshold - 80);
      const hi = Math.max(threshold * 2.2, threshold + 900);
      const t = Math.max(0, Math.min(1, (price - lo) / (hi - lo)));
      const hue = 125 - (t * 125);
      const sat = 58 + (t * 12);
      const light = 86 - (t * 24);
      return { bg: `hsl(${hue}, ${sat}%, ${light}%)`, ink: light < 50 ? "#fffaf2" : "#1c1915" };
    }
    function legendHTML(threshold, kind) {
      return `
        <div class="legend-scale"><span>Cheaper</span><span class="legend-bar" aria-hidden="true"></span><span>More expensive</span></div>
        <span class="legend-book"><span class="swatch book"></span> ≤ ${usd(threshold)}</span>
        <span class="legend-empty"><span class="swatch"></span> ${kind === "rt" ? "Not scanned yet" : "No data"}</span>
      `;
    }

    function onewayCellMap(data) {
      const grid = (data.calendar_grid && data.calendar_grid.oneway) || {};
      const map = new Map();
      for (const c of grid.cells || []) map.set(c.date, Object.assign({}, c));
      const cal = (data.calendar || {})["ATL-BOM"] || {};
      for (const pt of cal.OW || []) {
        if (!isMumbaiRoute("ATL-BOM")) continue;
        const row = map.get(pt.date) || { date: pt.date };
        if (row.google_usd == null && pt.price != null) row.google_usd = pt.price;
        map.set(pt.date, row);
      }
      for (const pt of cal.OW_skyscanner || []) {
        const row = map.get(pt.date) || { date: pt.date };
        if (row.skyscanner_usd == null && pt.price != null) row.skyscanner_usd = pt.price;
        map.set(pt.date, row);
      }
      const threshold = grid.threshold_usd || (data.recommendation && data.recommendation.oneway && data.recommendation.oneway.threshold_usd) || 500;
      return { map, threshold, windowStart: grid.window_start || "2026-12-15", windowEnd: grid.window_end || "2027-02-15" };
    }

    function renderOnewayGrid(data, rate) {
      const host = document.getElementById("owGrid");
      const legend = document.getElementById("owLegend");
      if (!host) return;
      const { map, threshold, windowStart, windowEnd } = onewayCellMap(data);
      if (legend) legend.innerHTML = legendHTML(threshold, "ow");
      const months = [
        { title: "December 2026", year: 2026, month: 11 },
        { title: "January 2027", year: 2027, month: 0 },
        { title: "February 2027", year: 2027, month: 1 }
      ];
      const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
      host.innerHTML = months.map(m => {
        const first = new Date(m.year, m.month, 1, 12);
        const lastDate = new Date(m.year, m.month + 1, 0, 12).getDate();
        const startPad = (first.getDay() + 6) % 7; // Monday = 0
        const cells = [];
        for (let i = 0; i < startPad; i++) cells.push({ type: "pad" });
        for (let day = 1; day <= lastDate; day++) {
          const dt = new Date(m.year, m.month, day, 12);
          const iso = isoFromDate(dt);
          const inWindow = iso >= windowStart && iso <= windowEnd;
          const info = map.get(iso) || { date: iso };
          const g = info.google_usd;
          const s = info.skyscanner_usd;
          const cheap = (g != null) ? g : null;
          const gUrl = info.google_url || googleFlightsUrl({ oneway: true, depart: iso });
          const sUrl = info.skyscanner_url || skyscannerUrl({ oneway: true, depart: iso });
          if (!inWindow) {
            cells.push({ type: "out", day });
          } else if (cheap == null && s == null) {
            cells.push({ type: "empty", day, iso, gUrl });
          } else if (cheap == null) {
            cells.push({ type: "ss-only", day, iso, s, gUrl, sUrl });
          } else {
            const gfOk = g != null && g <= threshold;
            const ssOk = s != null && s <= threshold;
            const book = cheap <= threshold;
            const bookClass = book ? (gfOk ? "book" : (ssOk ? "book-ss" : "book")) : "";
            const cheapUrl = gUrl;
            cells.push({ type: "has", day, iso, g, s, cheap, book, bookClass, gfOk, gUrl, sUrl, cheapUrl });
          }
        }
        const body = cells.map(c => {
          if (c.type === "pad") return `<div class="cal-cell out" aria-hidden="true"></div>`;
          if (c.type === "out") return `<div class="cal-cell out"><div class="cal-day">${c.day}</div></div>`;
          if (c.type === "empty") {
            return `<a class="cal-cell empty" href="${esc(c.gUrl)}" target="_blank" rel="noopener noreferrer" title="Open Google Flights ${c.iso}">
              <div class="cal-day">${c.day}</div><div class="cal-src">No data</div>
            </a>`;
          }
          if (c.type === "ss-only") {
            return `<div class="cal-cell empty" title="${c.iso}: Google not scanned; Skyscanner may include self-transfers">
              <div class="cal-day">${c.day}</div>
              <div class="cal-src">${extLink(c.sUrl, "SS " + usd(c.s))}<br>GF —</div>
            </div>`;
          }
          const col = fareColor(c.cheap, threshold);
          const flag = c.book ? `<span class="cal-flag">${c.gfOk ? "≤" : "SS"}</span>` : "";
          const gfLine = c.g != null ? extLink(c.gUrl, `GF ${usd(c.g)}`) : "GF —";
          const ssLine = c.s != null ? extLink(c.sUrl, `SS ${usd(c.s)}`) : "";
          return `<div class="cal-cell has ${c.bookClass}" style="background:${col.bg};color:${col.ink}">
            <div class="cal-day"><span>${c.day}</span>${flag}</div>
            ${extLink(c.cheapUrl, `<div class="cal-main">${usd(c.cheap)}</div>${rate ? `<div class="cal-inr">${inr(c.cheap, rate)}</div>` : ""}`, "cal-main-link")}
            <div class="cal-src">${gfLine}${ssLine ? "<br>" + ssLine : ""}</div>
          </div>`;
        }).join("");
        return `<div class="cal-month">
          <h4>${m.title}</h4>
          <div class="cal-weekdays">${weekdays.map(w => `<span>${w}</span>`).join("")}</div>
          <div class="cal-weeks">${body}</div>
        </div>`;
      }).join("");
    }

    function renderRoundtripGrid(data, rate) {
      const host = document.getElementById("rtGrid");
      const legend = document.getElementById("rtLegend");
      if (!host) return;
      const grid = (data.calendar_grid && data.calendar_grid.roundtrip) || {};
      const threshold = grid.threshold_usd || (data.recommendation && data.recommendation.roundtrip && data.recommendation.roundtrip.threshold_usd) || 900;
      const windows = grid.return_windows_days || [170, 171, 172, 173, 174, 175, 176, 177, 178, 179];
      const start = grid.depart_start || "2026-12-15";
      const end = grid.depart_end || "2027-02-15";
      const step = grid.row_step_days || 7;
      if (legend) legend.innerHTML = legendHTML(threshold, "rt");

      const scanned = new Map();
      for (const c of grid.cells || []) {
        if (!c.depart || c.price_usd == null) continue;
        const stay = c.stay_days != null ? c.stay_days : (c.return ? Math.round((parseISO(c.return) - parseISO(c.depart)) / 86400000) : null);
        if (stay == null) continue;
        const key = c.depart + "|" + stay;
        const prev = scanned.get(key);
        if (!prev || c.price_usd < prev.price_usd) scanned.set(key, Object.assign({ stay_days: stay }, c));
      }

      const departs = [];
      for (let iso = start; iso <= end; iso = addDaysISO(iso, step)) departs.push(iso);
      for (const key of scanned.keys()) {
        const dep = key.split("|")[0];
        if (!departs.includes(dep) && dep >= start && dep <= end) departs.push(dep);
      }
      departs.sort();

      const head = `<th class="rt-depart">Depart</th>` + windows.map(w => {
        return `<th title="Stay ${w} days (visa limit 180 days)">+${w}d</th>`;
      }).join("");

      const body = departs.map(dep => {
        const depLabel = fmtDate(dep);
        const tds = windows.map(w => {
          const ret = addDaysISO(dep, w);
          const cell = scanned.get(dep + "|" + w);
          const retLabel = fmtDate(ret);
          const tip = `Return ${retLabel} · stay ${w} days (visa limit 180 days)`;
          const href = (cell && cell.google_url) || googleFlightsUrl({ depart: dep, ret });
          if (!cell) {
            return `<td><a class="rt-cell unscanned" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(tip)}">Not scanned yet<br><span>${retLabel}</span></a></td>`;
          }
          const book = cell.price_usd <= threshold;
          const col = fareColor(cell.price_usd, threshold);
          return `<td><a class="rt-cell has ${book ? "book" : ""}" style="background:${col.bg};color:${col.ink}" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(tip + " · " + usd(cell.price_usd))}">
            <div class="cal-day"><span>${retLabel}</span>${book ? `<span class="cal-flag">≤${usd(threshold)}</span>` : ""}</div>
            <div class="cal-main">${usd(cell.price_usd)}</div>
            ${rate ? `<div class="cal-inr">${inr(cell.price_usd, rate)}</div>` : ""}
            ${cell.hours || cell.duration ? `<div class="cal-src">${esc(cell.hours || cell.duration)}</div>` : ""}
          </a></td>`;
        }).join("");
        return `<tr><td class="rt-depart">${depLabel}</td>${tds}</tr>`;
      }).join("");

      const scannedCount = scanned.size;
      const total = departs.length * windows.length;
      host.innerHTML = `<div class="rt-wrap" aria-label="Round-trip fare grid, ${scannedCount} of ${total} cells scanned">
        <table class="rt-table">
        <thead><tr>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>`;
    }

    function renderFareGrids(data, rate) {
      renderOnewayGrid(data, rate);
      renderRoundtripGrid(data, rate);
    }

    function allDates() {
      const out = [];
      const start = new Date("2026-12-15T00:00:00");
      const end = new Date("2027-02-15T00:00:00");
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        out.push(`${y}-${m}-${day}`);
      }
      return out;
    }

    function seriesFor(points, labels) {
      const map = new Map((points || []).map(p => [p.date, p.price]));
      return labels.map(d => (map.has(d) ? map.get(d) : null));
    }

    function drawCalendar(data) {
      const el = document.getElementById("calChart");
      if (!el || typeof Chart === "undefined") return;
      const labels = allDates();
      const cal = data.calendar || {};
      const colors = {
        "ATL-BOM OW": "#8c2f14",
        "ATL-BOM OW_skyscanner": "#1b5a52",
        "ATL-BOM RT": "#c47b3a",
        "NYC-BOM OW": "#3b6fa0",
        "NYC-BOM RT": "#5a3d7a"
      };
      const datasets = [];
      for (const route of Object.keys(cal)) {
        if (!isMumbaiRoute(route)) continue;
        for (const trip of Object.keys(cal[route] || {})) {
          const pts = cal[route][trip];
          if (!pts || !pts.length) continue;
          // Skip a series that is all null / empty of actual prices
          if (!pts.some(pt => pt && pt.price != null)) continue;
          let label;
          if (trip === "OW_skyscanner") label = "Skyscanner (cheapest incl. self-transfer)";
          else if (trip === "OW") label = `${route} one-way (Google Flights)`;
          else if (trip === "RT") label = `${route} round trip`;
          else label = `${route} ${trip}`;
          const key = `${route} ${trip}`;
          datasets.push({
            label,
            data: seriesFor(pts, labels),
            borderColor: colors[key] || "#333",
            backgroundColor: "transparent",
            borderWidth: 2,
            spanGaps: false,
            pointRadius: 0,
            pointHoverRadius: 4,
            tension: 0.15
          });
        }
      }
      const tickEvery = 7;
      new Chart(el, {
        type: "line",
        data: {
          labels: labels.map(d => {
            const dt = new Date(d + "T00:00:00");
            return dt.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
          }),
          datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 14, font: { family: "Source Sans 3" } } },
            tooltip: {
              callbacks: {
                title: items => labels[items[0].dataIndex],
                label: item => item.raw == null ? null : ` ${item.dataset.label}: ${usd(item.raw)}`
              }
            }
          },
          scales: {
            x: {
              ticks: {
                maxRotation: 0,
                autoSkip: false,
                callback: function(val, i) { return i % tickEvery === 0 ? this.getLabelForValue(val) : ""; },
                font: { family: "Source Sans 3", size: 11 },
                color: "#5c564c"
              },
              grid: { color: "rgba(28,25,21,0.06)" }
            },
            y: {
              ticks: {
                callback: v => "$" + v,
                font: { family: "Source Sans 3" },
                color: "#5c564c"
              },
              grid: { color: "rgba(28,25,21,0.08)" },
              title: { display: true, text: "USD", font: { family: "Source Sans 3" } }
            }
          }
        }
      });
    }

    function drawHistory(data) {
      const el = document.getElementById("histChart");
      if (!el || typeof Chart === "undefined") return;
      const rows = cheapestHistory(data.history || []);
      const dates = [...new Set(rows.map(r => r.ts))].sort();
      const seriesKeys = [...new Set(rows.map(r => `${r.route} ${r.trip}`))].sort();
      const colors = ["#8c2f14", "#1b5a52", "#c47b3a", "#3b6fa0", "#5a3d7a", "#3a5c1b"];
      const datasets = seriesKeys.map((key, i) => {
        const [route, trip] = key.split(" ");
        return {
          label: `${route} ${trip === "RT" ? "round trip" : "one-way"} (cheapest that scan)`,
          data: dates.map(ts => {
            const hit = rows.find(r => r.ts === ts && r.route === route && r.trip === trip);
            return hit ? hit.price : null;
          }),
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length],
          borderWidth: 2,
          spanGaps: true,
          pointRadius: 5,
          tension: 0.2
        };
      });
      if (!dates.length) {
        el.parentElement.insertAdjacentHTML("beforeend", "<p class='caption'>No history points yet.</p>");
        return;
      }
      new Chart(el, {
        type: "line",
        data: { labels: dates, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 14, font: { family: "Source Sans 3" } } },
            tooltip: { callbacks: { label: item => item.raw == null ? null : ` ${item.dataset.label}: ${usd(item.raw)}` } }
          },
          scales: {
            x: { ticks: { font: { family: "Source Sans 3" }, color: "#5c564c" }, grid: { color: "rgba(28,25,21,0.06)" } },
            y: {
              ticks: { callback: v => "$" + v, font: { family: "Source Sans 3" }, color: "#5c564c" },
              grid: { color: "rgba(28,25,21,0.08)" },
              title: { display: true, text: "USD", font: { family: "Source Sans 3" } }
            }
          }
        }
      });
    }

    fetch("data.json?ts=" + Date.now())
      .then(r => {
        if (!r.ok) throw new Error("Could not load data.json (" + r.status + ")");
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById("app").innerHTML = `<p class="error">The fare data could not be loaded. ${esc(err.message)}. Try refreshing in a moment.</p>`;
      });
  </script>
</body>
</html>
